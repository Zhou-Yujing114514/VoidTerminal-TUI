name: TUI Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile voidterminal.py src/__init__.py src/api.py src/app.py src/ws_client.py

      - name: Show version
        run: python -c "import sys; sys.path.insert(0,'.'); from src.__init__ import __version__; print('version', __version__)"

      - name: Package source archive
        run: |
          mkdir -p dist
          tar --exclude='./.git' --exclude='./.venv' --exclude='./venv' --exclude='./__pycache__' \
              -czf dist/VoidTerminal-TUI-src.tar.gz .
          ls -l dist/

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: voidterminal-tui-src
          path: dist/VoidTerminal-TUI-src.tar.gz
